name: Upgrade 1.4.9 Merge Diagnosis
on:
  push:
    branches: ['upgrade/v1.4.9-aips.1']
    paths: ['.github/workflows/upgrade-149.yml']
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch official releases
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/robbietilton/Compositor.git
          git fetch --no-tags upstream refs/tags/v1.4.5:refs/tags/base-145 refs/tags/v1.4.9:refs/tags/target-149
      - name: Three-way merge and package conflicts
        shell: bash
        run: |
          set +e
          set -uo pipefail
          git diff --binary base-145 target-149 > /tmp/upgrade.patch
          git apply --3way --index /tmp/upgrade.patch 2>&1 | tee /tmp/merge.log
          result=${PIPESTATUS[0]}
          mkdir -p report
          printf 'merge_exit=%s\n' "$result" > report/status.txt
          git diff --name-only --diff-filter=U > report/conflicts.txt
          git diff --name-only --cached > report/staged.txt
          cp /tmp/merge.log report/merge.log
          mkdir -p report/conflict-files
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            mkdir -p "report/conflict-files/$(dirname "$f")"
            cp "$f" "report/conflict-files/$f"
          done < report/conflicts.txt
          cat report/status.txt
          cat report/conflicts.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: upgrade-149-merge-diagnostic
          path: report/
          retention-days: 14

      - name: Apply reviewed conflict resolutions and commit candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/upgrade_149_resolve.py
          rm -rf report
          git add -A
          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            echo "::error::Unresolved merge conflicts remain"
            exit 1
          fi
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync Compositor v1.4.9 into Aips candidate"
          git push origin HEAD:upgrade/v1.4.9-aips.1
