name: Verify brand cleanup and repair release titles
on:
  push:
    branches: ['cleanup/remove-aips-brand']
    paths: ['.github/workflows/remove-brand.yml']
permissions:
  contents: write
jobs:
  brand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify no legacy brand in tracked files
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -i 'aips' -- ':!.github/workflows/remove-brand.yml'; then
            echo "::error::Legacy brand remains"
            exit 1
          fi
          echo "Tracked project text is free of legacy brand references"
      - name: Correct release titles without rewriting historic tags
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release list --limit 100 --json tagName,name --jq '.[] | select(.name | test("(?i)aips")) | .tagName' | while read -r tag; do
            [ -n "$tag" ] || continue
            gh release edit "$tag" --title "Compositor-ZH $tag"
          done
          gh release view v1.4.9-zh.1 --json name,tagName
